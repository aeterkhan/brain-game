<style>
  :root{
    --paper:#EAE3D4;
    --card:#FBF8F1;
    --card-2:#F4EEE1;
    --ink:#16282B;
    --ink-soft:#5B6B6E;
    --teal:#0F766E;
    --teal-bright:#14B8A6;
    --teal-wash:#DBEDE9;
    --amber:#B45309;
    --amber-wash:#F3E4CF;
    --dim:#BBB2A0;
    --line:#D6CBB7;
    --shadow:rgba(22,40,43,.12);
    --ok:#0F766E;
    --no:#A14334;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Gowun Dodum',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #F0EADD 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #E2DAC9 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 20px 64px;min-height:100%;display:flex;flex-direction:column}

  /* ---------- header / progress ---------- */
  header{margin-bottom:18px}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.45rem;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .brand .seal{
    width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--card);
    font-family:'Gaegu',cursive;font-weight:700;display:grid;place-items:center;font-size:1.15rem;transform:rotate(-4deg)
  }
  .tag{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}

  .track{display:flex;gap:7px;margin-top:16px}
  .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default}
  .dot{
    width:100%;height:6px;border-radius:99px;background:var(--line);transition:background .4s, box-shadow .4s;
  }
  .node.done .dot{background:var(--teal)}
  .node.active .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-wash)}
  .nlabel{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.04em;color:var(--ink-soft);text-align:center}
  .node.active .nlabel{color:var(--amber)}
  .node.done .nlabel{color:var(--teal)}

  /* ---------- card / screen ---------- */
  .stage{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 18px 40px -24px var(--shadow);padding:30px 26px;flex:1;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .eyebrow .num{background:var(--teal);color:var(--card);border-radius:5px;padding:1px 7px;font-size:.62rem}
  h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.9rem;line-height:1.25;letter-spacing:-.02em;margin-bottom:12px}
  h2{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.35rem;line-height:1.3;margin-bottom:10px}
  p.lead{color:var(--ink-soft);font-size:1.02rem;margin-bottom:8px}
  .hint{font-size:.9rem;color:var(--ink-soft)}

  /* ---------- intro ---------- */
  .forget-demo{margin:22px 0;padding:20px;border-radius:16px;background:var(--card-2);border:1px dashed var(--line);text-align:center}
  .forget-demo .ftxt{font-family:'Gowun Batang',serif;font-size:1.5rem;font-weight:700;transition:filter 1.6s ease, opacity 1.6s ease, color .6s}
  .forget-demo.fading .ftxt{filter:blur(7px);opacity:.35;color:var(--dim)}
  .forget-demo .fcap{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.1em;color:var(--ink-soft);margin-top:14px}
  /* memory curve graph */
  .curvebox{margin:22px 0;padding:18px 14px 12px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}
  .curvebox svg{width:100%;height:auto;display:block}
  .grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
  .axis-line{stroke:var(--ink-soft);stroke-width:1.3}
  .axis-txt{font-family:'Space Mono',monospace;font-size:11px;fill:var(--ink-soft)}
  .curve-path{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .curve-forget{stroke:var(--dim);stroke-dasharray:5 6}
  .curve-reten{stroke:var(--teal)}
  .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.3s .2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .cmark{fill:var(--card);stroke:var(--teal);stroke-width:2.5;opacity:0;animation:pop .45s ease forwards}
  .cmark-tag{font-family:'Gaegu',cursive;font-size:13px;font-weight:700;fill:var(--teal);opacity:0;animation:pop .45s ease forwards}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .end-tag{font-family:'Gaegu',cursive;font-size:14px;font-weight:700}
  .curve-legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--ink-soft)}
  .curve-legend span{display:inline-flex;align-items:center;gap:7px}
  .curve-legend i{width:22px;height:0;border-top:3px solid;display:inline-block;border-radius:2px}
  .curve-legend i.dash{border-top-style:dashed}
  .principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:20px 0}
  .pchip{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
  .pchip .pt{font-weight:700;font-size:.92rem;margin-bottom:2px}
  .pchip .ps{font-size:.72rem;color:var(--ink-soft)}

  /* ---------- flashcards (stage 1) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0}
  .flip{perspective:1100px;height:172px;cursor:pointer}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
  .flip.on .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;padding:16px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
  .front{background:var(--ink);color:var(--card)}
  .front .step{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.14em;opacity:.7;margin-bottom:8px}
  .front .name{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.32rem;line-height:1.25}
  .front .tapme{margin-top:auto;font-family:'Gaegu',cursive;font-size:.92rem;opacity:.7}
  .back{background:var(--teal-wash);color:var(--ink);transform:rotateY(180deg);border-color:var(--teal)}
  .back .purpose{font-weight:700;color:var(--teal);margin-bottom:6px;font-size:1rem}
  .back .desc{font-size:.9rem;color:var(--ink-soft)}
  .flip.seen .front{outline:2px solid var(--teal);outline-offset:-2px}

  /* ---------- quiz ---------- */
  .q{margin-bottom:20px}
  .q-stem{font-weight:700;font-size:1.06rem;margin-bottom:12px;display:flex;gap:9px}
  .q-stem .qn{font-family:'Space Mono',monospace;color:var(--teal);flex:none}
  .opt{display:block;width:100%;text-align:left;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s,transform .1s}
  @media(hover:hover){.opt:hover{border-color:var(--teal)}}
  .opt:active{transform:scale(.99)}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--teal-wash);border-color:var(--teal);font-weight:700}
  .opt.wrong{background:#F3E0DB;border-color:var(--no)}
  .opt .mk{font-family:'Space Mono',monospace;font-weight:700;margin-right:8px}
  .explain{font-size:.9rem;color:var(--ink-soft);background:var(--card-2);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:11px 14px;margin-top:4px;animation:rise .35s both}
  .explain.bad{border-left-color:var(--no)}

  /* ---------- retrieval (stage 3) ---------- */
  .paperpad{
    width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    font-family:'Gaegu',cursive;font-size:1.18rem;line-height:1.9;color:var(--ink);
    background:
      repeating-linear-gradient(var(--card) 0 35px, var(--line) 35px 36px);
    background-attachment:local;
  }
  .paperpad:focus{outline:2px solid var(--teal);outline-offset:1px}
  .checklist{margin-top:18px;display:grid;gap:9px}
  .ck{display:flex;align-items:flex-start;gap:11px;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:background .2s,border-color .2s}
  .ck.hit{background:var(--teal-wash);border-color:var(--teal)}
  .ck .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;margin-top:1px;transition:.2s;font-family:'Space Mono',monospace;font-weight:700;color:transparent}
  .ck.hit .box{background:var(--teal);border-color:var(--teal);color:#fff}
  .ck .cktx b{display:block;font-size:.96rem}
  .ck .cktx span{font-size:.8rem;color:var(--ink-soft)}
  /* retrieval reveal */
  .collapsible{max-height:0;overflow:hidden;transition:max-height .55s ease}
  .collapsible.open{max-height:1400px}
  .reveal-note{margin-top:14px;font-size:.88rem;color:var(--ink);background:var(--amber-wash);border:1px dashed var(--amber);border-radius:11px;padding:12px 15px;line-height:1.55}
  .reveal-note.done{background:var(--teal-wash);border-color:var(--teal)}
  .reveal-note b{color:var(--amber)}
  .reveal-note.done b{color:var(--teal)}
  .paperpad[readonly]{opacity:.9;cursor:default}
  #revealBtn{margin-top:14px;width:100%}

  /* ---------- reorder (stage 5) ---------- */
  .seq{display:grid;gap:10px;margin:20px 0}
  .seqitem{display:flex;align-items:center;gap:12px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,background .2s,box-shadow .2s;user-select:none;touch-action:pan-y;-webkit-user-select:none}
  .seqitem .rank{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--card);font-family:'Space Mono',monospace;font-weight:700;display:grid;place-items:center;flex:none}
  .seqitem .lbl{flex:1;font-weight:700;font-size:1rem;pointer-events:none}
  .seqitem .lbl small{display:block;font-weight:400;font-size:.78rem;color:var(--ink-soft)}
  .handle{flex:none;width:38px;height:38px;display:grid;place-items:center;color:var(--ink-soft);font-size:1.35rem;line-height:1;cursor:grab;border-radius:9px;touch-action:none;transition:background .15s,color .15s}
  @media(hover:hover){.handle:hover{background:var(--card);color:var(--teal)}}
  .seqitem.dragging{box-shadow:0 14px 30px -10px var(--shadow);border-color:var(--teal);background:var(--card);cursor:grabbing;position:relative}
  .seqitem.dragging .handle{cursor:grabbing;color:var(--teal)}
  .seqitem.right{background:var(--teal-wash);border-color:var(--teal)}
  .seqitem.right .rank{background:var(--teal)}
  .seqitem.wrong{background:#F3E0DB;border-color:var(--no)}
  .seqitem.wrong .rank{background:var(--no)}
  .seqitem.dragging{cursor:grabbing}
  .seqitem.right,.seqitem.wrong{cursor:default;touch-action:auto}
  @keyframes celebrate{0%{transform:none}35%{transform:translateY(-7px) scale(1.03)}70%{transform:translateY(0) scale(.99)}100%{transform:none}}
  .seqitem.celebrate{animation:celebrate .55s ease both}

  /* ---------- result ---------- */
  .meter{margin:22px 0}
  .meter .bar{height:18px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
  .meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-bright));border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .meter .mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .meter .mscore{font-family:'Gowun Batang',serif;font-weight:700;font-size:1.5rem}
  .meter .mscore small{font-size:.9rem;color:var(--ink-soft);font-family:'Gowun Dodum'}
  .spacing{margin:22px 0;padding:18px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}
  .spacing h2{font-size:1.12rem;margin-bottom:4px}
  .reps{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .rep{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:.2s}
  .rep .rd{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.08em;color:var(--ink-soft)}
  .rep .rt{font-weight:700;margin-top:3px}
  .rep.set{background:var(--teal-wash);border-color:var(--teal)}
  .rep.set .rt{color:var(--teal)}
  .rep .chk{font-family:'Space Mono',monospace;color:var(--teal);height:1em;font-size:.8rem}

  /* timer */
  .timer{margin:22px 0;padding:18px;border-radius:16px;background:var(--ink);color:var(--card);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .timer .clock{font-family:'Space Mono',monospace;font-weight:700;font-size:2.2rem;letter-spacing:.02em;min-width:128px}
  .timer .tcap{flex:1;min-width:140px}
  .timer .tcap b{font-family:'Gowun Batang',serif;font-size:1.05rem}
  .timer .tcap span{display:block;font-size:.82rem;opacity:.75;margin-top:2px}
  @keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(20,184,166,0)}50%{box-shadow:0 0 0 7px rgba(20,184,166,.4)}}
  .timer.ringing{animation:ring 1s ease-in-out 5}
  .timer.ringing .clock{color:var(--teal-bright)}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:var(--card);padding:14px 22px;border-radius:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.55);font-weight:700;font-size:.98rem;z-index:9999;display:flex;align-items:center;gap:10px;animation:toastIn .4s cubic-bezier(.2,.8,.2,1) both}
  .toast .tdot{width:10px;height:10px;border-radius:99px;background:var(--teal-bright);flex:none;animation:tpulse 1s ease-in-out infinite}
  @keyframes tpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
  .toast.out{animation:toastOut .5s ease forwards}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,-14px)}}

  .warn{margin-top:18px;padding:16px 18px;border-radius:14px;border:1px dashed var(--amber);background:var(--amber-wash);color:var(--ink)}
  .warn-pop{display:inline-block;margin-top:12px;font-family:'Gowun Batang',serif;font-weight:700;font-size:1.28rem;line-height:1.5;color:var(--ink);background:linear-gradient(transparent 58%, #E7B374 58%);padding:1px 5px;border-radius:3px;letter-spacing:-.01em}
  .warn b{color:var(--amber)}

  /* ---------- buttons / footer ---------- */
  .actions{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;border:none;border-radius:13px;padding:14px 24px;cursor:pointer;transition:transform .12s,box-shadow .25s,background .2s;font-size:1rem}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:var(--card);box-shadow:0 10px 22px -12px var(--shadow)}
  @media(hover:hover){.btn-primary:hover{background:#0d2024}}
  .btn-primary:disabled{background:var(--dim);cursor:not-allowed;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  @media(hover:hover){.btn-ghost:hover{border-color:var(--ink)}}
  .btn-teal{background:var(--teal);color:#fff}
  @media(hover:hover){.btn-teal:hover{background:#0c5f59}}
  .grow{flex:1}
  .center{display:flex;justify-content:center}

  footer{margin-top:22px;text-align:center;font-size:.74rem;color:var(--ink-soft);line-height:1.7}
  footer .src{font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.05em}

  .feedline{font-family:'Gaegu',cursive;font-size:1.18rem;color:var(--teal);margin-top:14px;min-height:1.4em}
  .feedline.warn-t{color:var(--amber)}

  /* ---------- stamps / history (출석 도장) ---------- */
  .stampcard{margin:22px 0;padding:18px;border-radius:16px;background:var(--card-2);border:1px solid var(--line)}
  .stamphead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .stamphead h2{margin:0;font-size:1.12rem}
  .seehist{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.04em;color:var(--teal);background:none;border:none;cursor:pointer;font-weight:700;padding:0}
  @media(hover:hover){.seehist:hover{text-decoration:underline}}
  .stampstat{font-size:.94rem;color:var(--ink-soft)}
  .stampstat b{color:var(--teal)}
  .todaystamp{display:flex;align-items:center;gap:14px;background:var(--card);border:1px dashed var(--teal);border-radius:14px;padding:13px 15px;margin-bottom:14px}
  .todaystamp .big{width:48px;height:48px;flex:none}
  .todaystamp .big .seal2{width:100%;height:100%;font-size:1.6rem}
  .todaystamp .tcap b{font-family:'Gowun Batang',serif;font-size:1.04rem}
  .todaystamp .tcap span{display:block;font-size:.82rem;color:var(--ink-soft);margin-top:2px}

  .stamprow{display:flex;gap:10px;margin:20px 0}
  .statbox{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:15px 8px;text-align:center}

const STAMP_KEY="baekji.stamps";
function loadStamps(){ try{ return JSON.parse(localStorage.getItem(STAMP_KEY))||{}; }catch(_){ return {}; } }
function saveStamps(o){ try{ localStorage.setItem(STAMP_KEY,JSON.stringify(o)); }catch(_){} }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey(){ return dateKey(new Date()); }
function stampToday(){ const s=loadStamps(),k=todayKey(); s[k]=(s[k]||0)+1; saveStamps(s); }
function stampStats(){
  const s=loadStamps(), keys=Object.keys(s);
  let streak=0; const d=new Date();
  while(s[dateKey(d)]){ streak++; d.setDate(d.getDate()-1); } // 오늘부터 거슬러 연속 출석
  const ym=todayKey().slice(0,7);
  return { total:keys.length, streak, thisMonth:keys.filter(k=>k.startsWith(ym)).length };
}

function backFromHistory(){ go(state._historyFrom||'intro'); }

function shiftMonth(n){ state.monthOffset=Math.min(0,state.monthOffset+n); renderCal(); } // 미래 달은 막음
function shiftWeek(n){ state.weekOffset=Math.min(0,state.weekOffset+n); renderCal(); }

const DOW_KO=['월','화','수','목','금','토','일'];
function buildMonthGrid(year,month){
  const s=loadStamps(), tk=todayKey();
  const startDow=(new Date(year,month,1).getDay()+6)%7; // 월요일 시작 보정
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let day=1;day<=days;day++){
    const k=dateKey(new Date(year,month,day));
    cells.push({day,stamped:!!s[k],today:k===tk});
  }
  return cells;
}
function buildWeekGrid(offset){
  const s=loadStamps(), tk=todayKey();
  const d=new Date(); d.setDate(d.getDate()+offset*7);
  const monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
  const cells=[];
  for(let i=0;i<7;i++){
    const cur=new Date(monday); cur.setDate(monday.getDate()+i);
    const k=dateKey(cur);
    cells.push({date:cur,stamped:!!s[k],today:k===tk});
  }
  return cells;
}
function monthHTML(offset){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+offset);
  const y=base.getFullYear(), m=base.getMonth();
  const cells=buildMonthGrid(y,m);
  return `
    <div class="calnav">
      <button class="navbtn" onclick="shiftMonth(-1)" aria-label="이전 달">‹</button>
      <div class="callabel">${y}년 ${m+1}월</div>

    </div>
    <div class="calhead">${DOW_KO.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="calgrid">${cells.map(c=>{
      if(!c)return '<div class="cell empty"></div>';
      return `<div class="cell ${c.stamped?'stamped':''} ${c.today?'today':''}"><span class="dnum">${c.day}</span>${c.stamped?'<span class="seal2">出</span>':''}</div>`;
    }).join('')}</div>`;
}
function weekHTML(offset){
  const cells=buildWeekGrid(offset);
  const a=cells[0].date, b=cells[6].date;
  const label=`${a.getMonth()+1}/${a.getDate()} ~ ${b.getMonth()+1}/${b.getDate()}`;
  return `
    <div class="calnav">

      <div class="callabel">${label}</div>

}

/* 설계: 기존 state/render/finishStageN 을 교체하지 않고 감싼다.
   프로필은 단일 블롭 1키(baekji.v1.profile)에 저장 — 다중 키 정합성 비용 제거.
   출석 스탬프는 기존 baekji.stamps 를 단일 소스로 유지(stampStats 재사용).
   날짜는 항상 인자로 주입 → 순수 함수화(테스트 가능). */
const PROFILE_KEY="baekji.v1.profile";
const CONCEPT_IDS=RETRIEVE_KEYS.map(k=>k.id); // shelf/question/blank/detail/rebuild
const XP_PER=6;                               // 점수 1점당 XP (완주 22점 ≈ 132XP)
const LV=[0,80,200,380,620,920,1280,1700,2200,2800]; // 레벨 경계(누적 XP)
const LV_NAME=["입문","견습","숙련 Lv.3","숙련 Lv.4","숙련 Lv.5","달인 Lv.6","달인 Lv.7","명인 Lv.8","명인 Lv.9","종장 Lv.10"];

function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function newConcept(){ return {ease:2.5,intervalDays:0,due:null,reps:0,lapses:0,mastery:0}; }
function defaultProfile(){
  const concepts={}; CONCEPT_IDS.forEach(id=>concepts[id]=newConcept());
  return {v:1,updatedAt:null,xp:0,level:1,badges:{},concepts,
          progress:{active:false},daily:{date:null,seed:0,done:false},
          lastReport:null,_migratedStamps:false};
}
const Store={
  load(){
    let p=null; try{ p=JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(_){ p=null; }
    if(!p||p.v!==1) p=defaultProfile();
    // 손상/부분 데이터 방어 보정
    if(!p.concepts)p.concepts={};
    CONCEPT_IDS.forEach(id=>{ if(!p.concepts[id])p.concepts[id]=newConcept(); });
    if(!p.badges)p.badges={};
    if(!p.progress)p.progress={active:false};
    if(!p.daily)p.daily={date:null,seed:0,done:false};
    if(typeof p.xp!=='number')p.xp=0;
    return p;
  },
  save(p){ try{ p.updatedAt=new Date().toISOString(); localStorage.setItem(PROFILE_KEY,JSON.stringify(p)); }catch(_){} },
  patch(fn){ const p=Store.load(); fn(p); Store.save(p); return p; }
};
/* SM-2 경량화: grade 0~3 (0 놓침 · 2 맞음 · 3 쉽게 맞음) */
const SRS={
  addDays(key,n){ const d=parseKey(key); d.setDate(d.getDate()+n); return dateKey(d); },
  schedule(c,grade,todayK){
    if(grade<2){ c.reps=0; c.intervalDays=1; c.lapses++; }
    else{
      c.reps++;
      c.intervalDays = c.reps===1?1 : c.reps===2?3 : Math.round((c.intervalDays||3)*c.ease);
      c.ease=Math.max(1.3, c.ease+(0.1-(3-grade)*0.08));
    }
    c.due=SRS.addDays(todayK,c.intervalDays);
    c.mastery=Math.max(0,Math.min(100,c.mastery+(grade>=2?18:-12)));
    return c;
  },
  due(p,todayK){ return CONCEPT_IDS.filter(id=>{ const c=p.concepts[id]; return c.due && c.due<=todayK; }); }
};
const Meta={
  levelFor(xp){ let lv=1; for(let i=0;i<LV.length;i++){ if(xp>=LV[i])lv=i+1; } return lv; },
  levelInfo(xp){
    const lv=Meta.levelFor(xp), cur=LV[lv-1]||0, next=LV[lv]||(cur+700);
    return {lv,name:LV_NAME[lv-1]||("Lv."+lv),cur,next,into:xp-cur,span:next-cur,pct:Math.max(0,Math.min(100,Math.round((xp-cur)/(next-cur)*100)))};
  },
  addXp(p,n){ const before=Meta.levelFor(p.xp); p.xp=(p.xp||0)+n; p.level=Meta.levelFor(p.xp); return Meta.levelFor(p.xp)>before; },
  checkBadges(p,todayK){
    const st=stampStats(), newly=[];
    const grant=k=>{ if(!p.badges[k]){ p.badges[k]=todayK; newly.push(k); } };
    if(st.total>=1)grant('firstStamp');
    if(st.streak>=7)grant('streak7');
    if(st.streak>=30)grant('streak30');
    if(state.maxCombo>=5)grant('combo5');
    if(CONCEPT_IDS.filter(id=>p.concepts[id].mastery>=80).length>=5)grant('allMaster');
    return newly;
  }
};
const BADGE_META={
  firstStamp:{icon:"出",t:"첫 도장",d:"첫 완주 달성"},
  streak7:{icon:"7",t:"7일 연속",d:"일주일 개근"},
  streak30:{icon:"30",t:"30일 연속",d:"한 달 개근"},
  combo5:{icon:"⚡",t:"5연속 정답",d:"한 판 5콤보"},
  allMaster:{icon:"★",t:"5단계 숙련",d:"모든 개념 숙련도 80+"}
};
/* 절제된 game feel — 일반판은 짧고 낮은 단음 */
function blip(freqs,step,vol){
  const ac=ensureAudio(); if(!ac)return;
  const t0=ac.currentTime+0.01;
  freqs.forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f;
    const t=t0+i*(step||0.09);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(step||0.09));
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+(step||0.09)+0.03);
  });
}
function haptic(pat){ if(navigator.vibrate){ try{navigator.vibrate(pat);}catch(_){} } }
const Feel={
  ok(){ blip([880,1174],0.08,0.15); haptic(16); },        // 정답
  miss(){ blip([320],0.16,0.12); },                        // 오답
  combo(n){ blip([700+Math.min(n,6)*70],0.07,0.13); },     // 콤보 상승
  levelup(){ blip([660,880,1320],0.11,0.17); haptic([18,40,26]); }
};
/* 정답률 → SRS grade 매핑 */
function gradeFromRatio(r){ return r>=0.999?3 : r>=0.5?2 : r>0?1 : 0; }
/* 날짜 시드 (데일리 챌린지 고정성) */
function seedFromDate(k){ return parseInt(k.replace(/-/g,''),10); }

/* ---------- 진도 저장 / 이어하기 ---------- */
const IN_SESSION=["stage1","stage2","stage3","stage4","stage5"];
function snapshotProgress(){
  // 정규 5단계 진행 중에만 active 스냅샷 저장. home/intro/result/review/history 는 미저장.
  if(state.mode!=="full"){ return; }
  const active=IN_SESSION.includes(state.screen);
  Store.patch(p=>{
    const started=(p.progress&&p.progress.startedAt)||new Date().toISOString();
    p.progress = active ? {
      active:true, startedAt:started, screen:state.screen,
      scoreParts:state.scoreParts, seen:Array.from(state.seen),
      quiz2:state.quiz2, quiz4:state.quiz4, q2ans:state.q2ans, q4ans:state.q4ans,
      retrieveText:state.retrieveText, retrieveChecks:state.retrieveChecks, retrieveRevealed:state.retrieveRevealed,
      order:state.order, orderChecked:state.orderChecked, _shuffled:!!state._shuffled,
      combo:state.combo, maxCombo:state.maxCombo, sessionXp:state.sessionXp, wrongConcepts:state.wrongConcepts
    } : {active:false};
  });
}
function restoreProgress(p){
  const g=p.progress; if(!g||!g.active)return false;
  Object.assign(state,{
    scoreParts:g.scoreParts||{}, seen:new Set(g.seen||[]),
    quiz2:g.quiz2||state.quiz2, quiz4:g.quiz4||state.quiz4,
    q2ans:g.q2ans||[], q4ans:g.q4ans||[],
    retrieveText:g.retrieveText||"", retrieveChecks:g.retrieveChecks||Array(RETRIEVE_KEYS.length).fill(false),
    retrieveRevealed:!!g.retrieveRevealed,
    order:g.order||[0,1,2,3,4], orderChecked:!!g.orderChecked, _shuffled:!!g._shuffled,
    combo:g.combo||0, maxCombo:g.maxCombo||0, sessionXp:g.sessionXp||0,
    wrongConcepts:g.wrongConcepts||[], mode:"full", resumed:true
  });
  state._resumeScreen=g.screen;
  return true;
}
function clearSession(){
  Object.assign(state,{
    scoreParts:{}, seen:new Set(),
    retrieveChecks:Array(RETRIEVE_KEYS.length).fill(false), retrieveText:"", retrieveRevealed:false,
    order:[0,1,2,3,4], orderChecked:false, _shuffled:false,
    combo:0, maxCombo:0, sessionXp:0, wrongConcepts:[]
  });
}

function bootApp(){

function buildCurveSVG(){
  const W=680,H=290,padL=46,padR=22,padT=26,padB=46;
  const x0=padL,x1=W-padR,y0=H-padB,y1=padT;
  const SX=t=>x0+t*(x1-x0);
  const SY=v=>y0-(v/100)*(y0-y1);
  // sawtooth retention: resets to 100 at each review, decays slower each time
  const starts=[0,0.12,0.40,0.68], ends=[0.12,0.40,0.68,1.0], ks=[10,4.5,3.0,1.8];
  let rp=[];
  for(let s=0;s<4;s++){
    const a=starts[s],b=ends[s],k=ks[s];
    for(let i=0;i<=20;i++){const t=a+(b-a)*i/20;const v=100*Math.exp(-k*(t-a));rp.push([SX(t),SY(v)]);}
  }
  // pure forgetting (no review)
  let fp=[];
  for(let i=0;i<=80;i++){const t=i/80;const v=100*Math.exp(-3.5*t);fp.push([SX(t),SY(v)]);}
  const toPath=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const grid=[0,50,100].map(v=>`<line class="grid-line" x1="${x0}" y1="${SY(v).toFixed(1)}" x2="${x1}" y2="${SY(v).toFixed(1)}"/><text class="axis-txt" x="${x0-8}" y="${(SY(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join("");
  const xl=[[0,'지금'],[0.12,'20분'],[0.40,'1일'],[0.68,'3일'],[1.0,'1주']]
    .map(([t,l])=>`<text class="axis-txt" x="${SX(t).toFixed(1)}" y="${y0+20}" text-anchor="middle">${l}</text>`).join("");
  const marks=[0.12,0.40,0.68].map((t,i)=>{
    const x=SX(t).toFixed(1),y=SY(100).toFixed(1),d=(0.55+i*0.3).toFixed(2);
    return `<text class="cmark-tag" x="${x}" y="${(SY(100)-12).toFixed(1)}" text-anchor="middle" style="animation-delay:${d}s">↑인출</text><circle class="cmark" cx="${x}" cy="${y}" r="5" style="animation-delay:${d}s"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="에빙하우스 망각곡선: 복습하지 않으면 기억은 가파르게 사라지고, 인출로 복습할 때마다 다시 솟아오르며 더 오래 유지된다">
    ${grid}
    <line class="axis-line" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>
    <path class="curve-path curve-forget" d="${toPath(fp)}"/>
    <path class="curve-path curve-reten draw" pathLength="100" d="${toPath(rp)}"/>
    ${marks}
    <text class="end-tag" fill="var(--dim)" x="${SX(1)-4}" y="${(SY(3)-6).toFixed(1)}" text-anchor="end">사라짐</text>
    <text class="end-tag" fill="var(--teal)" x="${SX(1)-4}" y="${(SY(56)-8).toFixed(1)}" text-anchor="end">남음</text>
  </svg>`;
}

/* ---------- generic quiz renderer ---------- */
/* ---------- quiz pool → round builder ---------- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuizSet(pool){
  return shuffle(pool).map(group=>{
    const v=group.variants[Math.floor(Math.random()*group.variants.length)];
    return {stem:v.stem, options:shuffle(v.options), ex:v.ex};
  });
}
function newQuizRound(){
  state.quiz2=buildQuizSet(QUIZ2_POOL);
  state.quiz4=buildQuizSet(QUIZ4_POOL);
  state.q2ans=Array(state.quiz2.length).fill(null);
  state.q4ans=Array(state.quiz4.length).fill(null);
}
function renderQuiz(opts){
  const {data,answersArr,eyebrowNum,eyebrowTxt,title,lead,nextKey,nextLabel,backScreen,stageKey}=opts;
  stageEl.innerHTML=`
    <div class="eyebrow"><span class="num">${eyebrowNum}</span> ${eyebrowTxt}</div>
    <h2>${title}</h2>
    <p class="lead">${lead}</p>
    <div id="qbox"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="go('${backScreen}')">← 뒤로</button>
      <button class="btn btn-primary grow" id="qnext" disabled onclick="${nextKey}">${nextLabel}</button>
    </div>`;
  const box=document.getElementById('qbox');
  box.innerHTML=data.map((q,qi)=>`
    <div class="q" data-qi="${qi}">
      <div class="q-stem"><span class="qn">Q${qi+1}.</span><span>${q.stem}</span></div>
      <div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-oi="${oi}" onclick="answer('${stageKey}',${qi},${oi})"><span class="mk">${String.fromCharCode(65+oi)}</span>${o.t}</button>`).join("")}</div>
      <div class="exslot"></div>
    </div>`).join("");
  answersArr.forEach((a,qi)=>{ if(a!==null) paintAnswer(stageKey,qi,a); });
  refreshQuizNext(stageKey);
}
function answer(stageKey,qi,oi){
  const arr=stageKey==="q2"?state.q2ans:state.q4ans;
  if(arr[qi]!==null) return; // lock
  arr[qi]=oi;
  const data=stageKey==="q2"?state.quiz2:state.quiz4;
  const correct=data[qi].options[oi].ok;
  if(correct){
    state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo);
    if(state.combo>=2)Feel.combo(state.combo); else Feel.ok();
  }else{
    state.combo=0; Feel.miss();
  }
  paintAnswer(stageKey,qi,oi);
  flashCombo(correct);
  refreshQuizNext(stageKey);
}
/* 콤보 표시 — 일반판은 절제된 상단 라벨 */
function flashCombo(correct){
  const q=document.querySelector(`.q[data-qi]`); // 위치 기준점(스테이지 상단)
  let el=document.getElementById('combobar');
  if(!el){ el=document.createElement('div'); el.id='combobar'; el.className='combobar'; stageEl.insertBefore(el,stageEl.firstChild.nextSibling); }
  if(correct && state.combo>=2){ el.textContent=`${state.combo} 연속 정답`; el.className='combobar show'; }
  else if(!correct){ el.textContent='콤보 리셋'; el.className='combobar reset show'; }
  else { el.className='combobar'; }
  clearTimeout(el._t); el._t=setTimeout(()=>{el.className='combobar';},1400);
}
function paintAnswer(stageKey,qi,oi){
  const data=stageKey==="q2"?state.quiz2:state.quiz4;
  const q=data[qi];
  const qEl=document.querySelector(`.q[data-qi="${qi}"]`);
  if(!qEl)return;
  qEl.querySelectorAll('.opt').forEach(b=>{
    const bi=+b.dataset.oi;
    b.disabled=true;
    if(q.options[bi].ok)b.classList.add('correct');
    if(bi===oi && !q.options[bi].ok)b.classList.add('wrong');
  });
  const good=q.options[oi].ok;
  qEl.querySelector('.exslot').innerHTML=`<div class="explain ${good?'':'bad'}">${good?'✓ ':'→ '}${q.ex}</div>`;
}
function refreshQuizNext(stageKey){
  const arr=stageKey==="q2"?state.q2ans:state.q4ans;
  const done=arr.length>0 && arr.every(a=>a!==null);
  const btn=document.getElementById('qnext');
  if(btn)btn.disabled=!done;
}

let DRAG=null;
const REDUCE=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
/* 드래그 설계 원칙: 드래그 중에는 DOM 순서를 바꾸지 않는다.
   누적 이동량(dy/step)으로 목표 인덱스만 계산해 다른 항목을 transform으로
   비켜주고, 손을 놓는 순간에 딱 한 번 순서를 재계산해 다시 그린다.
   → DOM 재배열 + 실시간 측정이 만들던 경계 진동("밀림")이 원천 제거된다. */
function startDrag(e){
  if(state.orderChecked)return;
  const item=e.target.closest('.seqitem');
  if(!item)return;
  if(e.button!==undefined && e.button!==0)return; // 좌클릭만
  // 손잡이(.handle)만 드래그 시작점이다. 항목 본문은 touch-action:pan-y 라
  // 리스트 위에서도 페이지가 세로 스크롤된다(손잡이에만 touch-action:none 유지).
  e.preventDefault();
  const seq=document.getElementById('seq');
  const items=[...seq.children];
  const rects=items.map(el=>el.getBoundingClientRect());
  const startIndex=items.indexOf(item);
  // 슬롯 간격 = 인접 항목 top 차이(=높이+gap). 항목 높이가 균일하므로 고정값으로 충분.
  const step=rects.length>1 ? Math.abs(rects[1].top-rects[0].top) : rects[startIndex].height+10;
  DRAG={item,seq,items,startIndex,curIndex:startIndex,n:items.length,step,startY:e.clientY,pid:e.pointerId};
  item.classList.add('dragging');
  item.style.transition='none';
  item.style.zIndex='30';
  try{item.setPointerCapture(e.pointerId);}catch(_){}
  item.addEventListener('pointermove',onDrag);
  item.addEventListener('pointerup',endDrag);
  item.addEventListener('pointercancel',endDrag);
}
function onDrag(e){
  if(!DRAG)return;
  e.preventDefault();
  const dy=e.clientY-DRAG.startY;
  DRAG.item.style.transform=`translateY(${dy}px)`; // 드래그 항목은 손가락을 그대로 따라감
  // 누적 이동량으로 목표 슬롯 결정. round 라서 반 칸 넘어야 자리 바뀜(히스테리시스).
  const moved=Math.round(dy/DRAG.step);
  const target=Math.max(0,Math.min(DRAG.n-1,DRAG.startIndex+moved));
  if(target!==DRAG.curIndex){
    DRAG.curIndex=target;
    applyDragShift();
  }
}
function applyDragShift(){
  const {items,startIndex,curIndex,step}=DRAG;
  items.forEach((el,oi)=>{
    let finalPos;
    if(oi===startIndex){
      finalPos=curIndex; // 드래그 항목의 표시 순위(transform은 onDrag가 관리)
    }else{
      finalPos=oi;
      if(oi>startIndex)finalPos--;      // 드래그 항목이 원래 자리에서 빠짐
      if(finalPos>=curIndex)finalPos++; // 드래그 항목이 목표 슬롯에 삽입됨
      const shift=(finalPos-oi)*step;
      el.style.transition=REDUCE?'none':'transform .16s cubic-bezier(.2,.8,.2,1)';
      el.style.transform= shift?`translateY(${shift}px)`:'';
    }
    const rk=el.querySelector('.rank');
    if(rk)rk.textContent=finalPos+1; // 순위 숫자도 실시간 갱신
  });
}
function endDrag(){
  if(!DRAG)return;
  const {item,items,startIndex,curIndex,pid}=DRAG;
  // 손을 놓는 순간 단 한 번 순서 재계산: startIndex 요소를 빼서 curIndex에 삽입
  const order=items.map(el=>+el.dataset.step);
  const [moved]=order.splice(startIndex,1);
  order.splice(curIndex,0,moved);
  // 인라인 스타일 정리
  items.forEach(el=>{el.style.transition='';el.style.transform='';el.style.zIndex='';el.classList.remove('dragging');});
  try{item.releasePointerCapture(pid);}catch(_){}
  item.removeEventListener('pointermove',onDrag);
  item.removeEventListener('pointerup',endDrag);
  item.removeEventListener('pointercancel',endDrag);
  DRAG=null;
  state.order=order;
  renderSeq(); // 깨끗하게 재렌더(순위·리스너 재등록)
}

}

function applyConceptGrades(p,tk){
  const map={shelf:'s1',question:'s2',blank:'s3',detail:'s4',rebuild:'s5'};

  });

let AUDIO=null, OLD_TITLE=null;
function ensureAudio(){
  try{
    if(!AUDIO)AUDIO=new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO&&AUDIO.state==='suspended')AUDIO.resume();
  }catch(_){AUDIO=null;}
  return AUDIO;
}
function playChime(){
  const ac=ensureAudio(); if(!ac)return;
  const seq=[523.25,659.25,783.99,1046.5]; // 도·미·솔·도 (C5 E5 G5 C6)
  const base=ac.currentTime+0.02;
  for(let r=0;r<2;r++){ // 부드러운 차임 2회
    seq.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=base + r*1.05 + i*0.16;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t+0.75);
    });
  }
}
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML='<span class="tdot"></span>'+msg;
  document.body.appendChild(t);
  const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),500);};
  t.addEventListener('click',kill);
  setTimeout(kill,6000);
}
function fireTimerAlert(){
  playChime();
  showToast('25분 집중 완료! 이제 백지에 꺼내볼 시간 ✎');
  const tm=document.querySelector('.timer'); if(tm)tm.classList.add('ringing');
  if(navigator.vibrate){try{navigator.vibrate([200,120,200,120,320]);}catch(_){}}
  try{ if(OLD_TITLE===null)OLD_TITLE=document.title; document.title='⏰ 집중 완료! · 백지의 방'; }catch(_){}
}
function clearTimerAlert(){
  const tm=document.querySelector('.timer'); if(tm)tm.classList.remove('ringing');
  try{ if(OLD_TITLE!==null){document.title=OLD_TITLE; OLD_TITLE=null;} }catch(_){}
}
function syncClock(){
  const c=document.getElementById('clock');
  if(!c)return;
  const m=String(Math.floor(state.timer.sec/60)).padStart(2,'0');
  const s=String(state.timer.sec%60).padStart(2,'0');
  c.textContent=`${m}:${s}`;
  const b=document.getElementById('tbtn');
  if(b)b.textContent=state.timer.running?"정지":(state.timer.sec===25*60?"시작":"재개");
}
function toggleTimer(){
  if(state.timer.running){
    clearInterval(state.timer.id);state.timer.running=false;
  }else{
    ensureAudio(); // 사용자 클릭 시점에 오디오 권한 확보(종료 시 소리 재생용)
    state.timer.running=true;
    state.timer.id=setInterval(()=>{
      if(state.timer.sec>0){state.timer.sec--;syncClock();}
      if(state.timer.sec===0){
        clearInterval(state.timer.id);state.timer.running=false;
        const c=document.getElementById('clock');if(c)c.textContent="끝! ✎";
        const cap=document.querySelector('.timer .tcap b');if(cap)cap.textContent="백지에 꺼내볼 시간";
        const b=document.getElementById('tbtn');if(b){b.textContent="다시 25분";b.onclick=()=>{clearTimerAlert();state.timer.sec=25*60;syncClock();};}
        fireTimerAlert();
      }
    },1000);
  }
  syncClock();
}

function restart(){
  if(state.timer.id)clearInterval(state.timer.id);
  clearTimerAlert();
  clearSession();
  Object.assign(state,{
    reps:{d1:false,d3:false,d7:false},
    timer:{sec:25*60,running:false,id:null},
    mode:"full", resumed:false, _resumeScreen:null
  });
  Store.patch(p=>p.progress={active:false});
  newQuizRound();
  go('home');
}

/* ============================ BOOT ============================ */
newQuizRound();
bootApp();
</script>
