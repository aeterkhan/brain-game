<style>
  :root{
    --bg:#FFF8EC;
    --card:#FFFFFF;
    --card-2:#FFF3DD;
    --ink:#39384B;
    --ink-soft:#6A6880;
    --blue:#3FA9F5;
    --blue-wash:#E2F2FF;
    --yellow:#FFC93C;
    --green:#46CC7D;
    --green-wash:#DDF6E6;
    --coral:#FF7A6B;
    --coral-wash:#FFE5E0;
    --purple:#A77BF0;
    --line:#FFE0B8;
    --dim:#ACA187;
    --shadow:rgba(120,90,40,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    -webkit-tap-highlight-color:transparent;
    font-family:'Gaegu','Jua',system-ui,sans-serif;
    background:
      radial-gradient(900px 480px at 85% -8%, #FFE9C2 0%, transparent 60%),
      radial-gradient(720px 420px at -8% 108%, #D9F0FF 0%, transparent 58%),
      var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    overflow-x:hidden;
    font-size:18px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));min-height:100%;display:flex;flex-direction:column}
  .center{text-align:center}

  /* ---------- header / progress ---------- */
  header{margin-bottom:16px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .brand{font-family:'Jua',sans-serif;font-size:1.5rem;display:flex;align-items:center;gap:9px;color:var(--ink)}
  .brand .blumo{width:42px;height:42px;display:grid;place-items:center;flex:none}
  .brand .blumo svg{filter:drop-shadow(0 3px 0 rgba(63,169,245,.28))}
  .tag{font-family:'Jua',sans-serif;font-size:.95rem;color:var(--blue);background:var(--blue-wash);padding:5px 12px;border-radius:99px}

  .track{display:flex;gap:6px;margin-top:14px}
  .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .dot{width:100%;height:10px;border-radius:99px;background:var(--line);transition:background .4s}
  .node.done .dot{background:var(--green)}
  .node.active .dot{background:var(--yellow);box-shadow:0 0 0 4px #FFE9B0}
  .nlabel{font-family:'Jua',sans-serif;font-size:.72rem;color:var(--ink-soft);text-align:center}
  .node.active .nlabel{color:#E8A400}
  .node.done .nlabel{color:var(--green)}

  /* ---------- card / screen ---------- */
  .stage{
    background:var(--card);border:3px solid #fff;border-radius:26px;
    box-shadow:0 16px 0 -4px var(--line), 0 26px 50px -28px var(--shadow);padding:26px 22px;flex:1;
    animation:rise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:'Jua',sans-serif;font-size:.95rem;color:#fff;font-weight:400;margin-bottom:12px;display:inline-flex;align-items:center;gap:8px;background:var(--blue);padding:6px 14px;border-radius:99px}
  .eyebrow .num{background:#fff;color:var(--blue);border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:.85rem}
  h1{font-family:'Jua',sans-serif;font-size:1.85rem;line-height:1.3;margin-bottom:12px;color:var(--ink)}
  h2{font-family:'Jua',sans-serif;font-size:1.4rem;line-height:1.3;margin-bottom:10px;color:var(--ink)}
  p.lead{font-size:1.18rem;margin-bottom:8px}
  .hint{font-size:1.02rem;color:var(--ink-soft)}
  b.hl{color:var(--coral)}
  b.hlb{color:var(--blue)}
  b.hlg{color:var(--green)}

  /* ---------- intro ---------- */
  .mascot{font-size:3.4rem;text-align:center;margin:6px 0 2px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
  .cbox{border-radius:18px;padding:16px 12px;text-align:center;border:3px solid}
  .cbox.bad{background:var(--coral-wash);border-color:#FFC9C0}
  .cbox.good{background:var(--green-wash);border-color:#BCEBCB}
  .cbox .cface{font-size:2.2rem}
  .cbox .ctitle{font-family:'Jua',sans-serif;font-size:1.05rem;margin:6px 0 10px}
  .cbar{height:16px;border-radius:99px;background:#fff;overflow:hidden;border:2px solid rgba(0,0,0,.05)}
  .cbar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .cbox.bad .cbar i{background:var(--coral)}
  .cbox.good .cbar i{background:var(--green)}
  .cbox .cpct{font-family:'Jua',sans-serif;font-size:1.4rem;margin-top:8px}
  .cbox.bad .cpct{color:var(--coral)}
  .cbox.good .cpct{color:var(--green)}
  .cbox .cnote{font-size:.92rem;color:var(--ink-soft);margin-top:2px}
  .principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin:18px 0}
  .pchip{background:var(--card-2);border:2px solid var(--line);border-radius:15px;padding:12px 8px;text-align:center}
  .pchip .pe{font-size:1.5rem}
  .pchip .pt{font-family:'Jua',sans-serif;font-size:.9rem;margin-top:3px}

  /* ---------- flashcards (stage 1) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin:20px 0}
  .flip{perspective:1100px;height:182px;cursor:pointer}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
  .flip.on .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:3px solid}
  .front{background:var(--blue);color:#fff;border-color:#fff;box-shadow:0 8px 0 -1px #2C8FDB}
  .front .fe{font-size:2.6rem}
  .front .step{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;opacity:.85;margin-top:6px}
  .front .name{font-family:'Jua',sans-serif;font-size:1.18rem;line-height:1.2;margin-top:2px}
  .front .tapme{margin-top:9px;font-size:.92rem;opacity:.9}
  .back{background:var(--yellow);color:#5A4500;transform:rotateY(180deg);border-color:#fff;box-shadow:0 8px 0 -1px #EBB31F}
  .back .purpose{font-family:'Jua',sans-serif;font-size:1.05rem;margin-bottom:6px}
  .back .desc{font-size:1rem;line-height:1.45}
  .flip.seen .front{box-shadow:0 8px 0 -1px #2C8FDB, 0 0 0 4px var(--green)}

  /* ---------- quiz ---------- */
  .q{margin-bottom:18px;background:var(--card-2);border:2px solid var(--line);border-radius:18px;padding:16px}
  .q-stem{font-family:'Jua',sans-serif;font-size:1.2rem;margin-bottom:12px;display:flex;gap:9px}
  .q-stem .qn{color:var(--blue);flex:none}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;font:inherit;font-size:1.08rem;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
  @media(hover:hover){.opt:hover{border-color:var(--blue)}}
  .opt:active{transform:scale(.98)}
  .opt:disabled{cursor:default}
  .opt .mk{width:30px;height:30px;border-radius:99px;background:var(--card-2);display:grid;place-items:center;font-family:'Jua',sans-serif;flex:none;color:var(--ink-soft)}
  .opt.correct{background:var(--green-wash);border-color:var(--green)}
  .opt.correct .mk{background:var(--green);color:#fff}
  .opt.wrong{background:var(--coral-wash);border-color:var(--coral)}
  .opt.wrong .mk{background:var(--coral);color:#fff}
  .explain{font-size:1.02rem;background:#fff;border:2px dashed var(--green);border-radius:13px;padding:11px 14px;margin-top:2px;animation:rise .3s both}
  .explain.bad{border-color:var(--coral)}
  .explain .ee{font-size:1.2rem;margin-right:4px}

  /* ---------- retrieval (stage 3) ---------- */
  .paperpad{
    width:100%;min-height:150px;resize:vertical;border:3px solid var(--line);border-radius:18px;padding:14px 16px;
    /* 아이가 입력하는 모든 한글이 확실히 렌더되도록 시스템 폰트 사용(서브셋 폰트 tofu 방지) */
    font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:1.3rem;line-height:1.85;color:var(--ink);
    background:repeating-linear-gradient(#fff 0 36px, var(--blue-wash) 36px 37px);background-attachment:local;
  }
  .paperpad:focus{outline:none;border-color:var(--blue)}
  .paperpad[readonly]{opacity:.92;cursor:default}
  .checklist{display:grid;gap:10px;margin-top:6px}
  .ck{display:flex;align-items:center;gap:12px;background:var(--card-2);border:3px solid var(--line);border-radius:15px;padding:12px 14px;cursor:pointer;transition:.18s}
  .ck.hit{background:var(--green-wash);border-color:var(--green)}
  .ck .box{width:30px;height:30px;border-radius:9px;border:3px solid var(--dim);flex:none;display:grid;place-items:center;transition:.2s;font-family:'Jua',sans-serif;color:transparent;font-size:1.1rem}
  .ck.hit .box{background:var(--green);border-color:var(--green);color:#fff}
  .ck .cke{font-size:1.5rem;flex:none}
  .ck .cktx b{display:block;font-family:'Jua',sans-serif;font-size:1.08rem}
  .ck .cktx span{font-size:.92rem;color:var(--ink-soft)}
  .reveal-note{margin-top:14px;font-size:1.05rem;background:var(--blue-wash);border:2px dashed var(--blue);border-radius:15px;padding:13px 15px;line-height:1.5}
  .reveal-note.done{background:var(--green-wash);border-color:var(--green)}
  #revealBtn{margin-top:14px;width:100%}

  /* ---------- reorder (stage 5) ---------- */
  .seq{display:grid;gap:11px;margin:18px 0}
  .seqitem{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:16px;padding:13px 14px;transition:border-color .2s,background .2s,box-shadow .2s;user-select:none;touch-action:pan-y;-webkit-user-select:none}
  .seqitem .rank{width:36px;height:36px;border-radius:11px;background:var(--blue);color:#fff;font-family:'Jua',sans-serif;font-size:1.2rem;display:grid;place-items:center;flex:none}
  .seqitem .se{font-size:1.7rem;flex:none}
  .seqitem .lbl{flex:1;font-family:'Jua',sans-serif;font-size:1.12rem;pointer-events:none}
  .seqitem .lbl small{display:block;font-family:'Gaegu',cursive;font-weight:400;font-size:.92rem;color:var(--ink-soft)}

const STAMP_KEY="baekji.kids.stamps"; // 어른용과 분리된 키
function loadStamps(){ try{ return JSON.parse(localStorage.getItem(STAMP_KEY))||{}; }catch(_){ return {}; } }
function saveStamps(o){ try{ localStorage.setItem(STAMP_KEY,JSON.stringify(o)); }catch(_){} }
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey(){ return dateKey(new Date()); }
function stampToday(){ const s=loadStamps(),k=todayKey(); s[k]=(s[k]||0)+1; saveStamps(s); }
function stampStats(){
  const s=loadStamps(), keys=Object.keys(s);
  let streak=0; const d=new Date();
  while(s[dateKey(d)]){ streak++; d.setDate(d.getDate()-1); }
  const ym=todayKey().slice(0,7);
  return { total:keys.length, streak, thisMonth:keys.filter(k=>k.startsWith(ym)).length };
}

const DOW_KO=['월','화','수','목','금','토','일'];
function buildMonthGrid(year,month){
  const s=loadStamps(), tk=todayKey();
  const startDow=(new Date(year,month,1).getDay()+6)%7;
  const days=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let day=1;day<=days;day++){
    const k=dateKey(new Date(year,month,day));
    cells.push({day,stamped:!!s[k],today:k===tk});
  }
  return cells;
}
function buildWeekGrid(offset){
  const s=loadStamps(), tk=todayKey();
  const d=new Date(); d.setDate(d.getDate()+offset*7);
  const monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
  const cells=[];
  for(let i=0;i<7;i++){
    const cur=new Date(monday); cur.setDate(monday.getDate()+i);
    const k=dateKey(cur);
    cells.push({date:cur,stamped:!!s[k],today:k===tk});
  }
  return cells;
}
function monthHTML(offset){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+offset);
  const y=base.getFullYear(), m=base.getMonth();
  const cells=buildMonthGrid(y,m);
  return `
    <div class="calnav">
      <button class="navbtn" onclick="shiftMonth(-1)" aria-label="이전 달">‹</button>
      <div class="callabel">${y}년 ${m+1}월</div>

    </div>

      return `<div class="cell ${c.stamped?'stamped':''} ${c.today?'today':''}"><span class="dnum">${c.day}</span>${c.stamped?'<span class="seal2">참</span>':''}</div>`;
    }).join('')}</div>`;
}
function weekHTML(offset){
  const cells=buildWeekGrid(offset);
  const a=cells[0].date, b=cells[6].date;

      </div>`).join('')}</div>`;
}

function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function newConcept(){ return {ease:2.5,intervalDays:0,due:null,reps:0,lapses:0,mastery:0}; }
function defaultProfile(){
  const concepts={}; CONCEPT_IDS.forEach(id=>concepts[id]=newConcept());
  return {v:1,updatedAt:null,xp:0,level:1,badges:{},concepts,
          progress:{active:false},daily:{date:null,seed:0,done:false},lastReport:null,_migratedStamps:false};
}
const Store={
  load(){
    let p=null; try{ p=JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(_){ p=null; }
    if(!p||p.v!==1) p=defaultProfile();
    if(!p.concepts)p.concepts={};
    CONCEPT_IDS.forEach(id=>{ if(!p.concepts[id])p.concepts[id]=newConcept(); });
    if(!p.badges)p.badges={};
    if(!p.progress)p.progress={active:false};
    if(!p.daily)p.daily={date:null,seed:0,done:false};
    if(typeof p.xp!=='number')p.xp=0;
    return p;
  },
  save(p){ try{ p.updatedAt=new Date().toISOString(); localStorage.setItem(PROFILE_KEY,JSON.stringify(p)); }catch(_){} },
  patch(fn){ const p=Store.load(); fn(p); Store.save(p); return p; }
};
/* kids SRS — 초기 간격 짧게(1·2·4일), 더 관대한 ease */
const SRS={
  addDays(key,n){ const d=parseKey(key); d.setDate(d.getDate()+n); return dateKey(d); },
  schedule(c,grade,todayK){
    if(grade<2){ c.reps=0; c.intervalDays=1; c.lapses++; }
    else{
      c.reps++;
      c.intervalDays = c.reps===1?1 : c.reps===2?2 : Math.round((c.intervalDays||2)*c.ease);
      c.ease=Math.max(1.4, c.ease+(0.12-(3-grade)*0.06));
    }
    c.due=SRS.addDays(todayK,c.intervalDays);
    c.mastery=Math.max(0,Math.min(100,c.mastery+(grade>=2?20:-10)));
    return c;
  },
  due(p,todayK){ return CONCEPT_IDS.filter(id=>{ const c=p.concepts[id]; return c.due && c.due<=todayK; }); }
};
const Meta={
  levelFor(xp){ let lv=1; for(let i=0;i<LV.length;i++){ if(xp>=LV[i])lv=i+1; } return lv; },
  levelInfo(xp){
    const lv=Meta.levelFor(xp), cur=LV[lv-1]||0, next=LV[lv]||(cur+700);
    return {lv,name:LV_NAME[lv-1]||("Lv."+lv),cur,next,into:xp-cur,span:next-cur,pct:Math.max(0,Math.min(100,Math.round((xp-cur)/(next-cur)*100)))};
  },
  addXp(p,n){ const before=Meta.levelFor(p.xp); p.xp=(p.xp||0)+n; p.level=Meta.levelFor(p.xp); return Meta.levelFor(p.xp)>before; },
  checkBadges(p,todayK){
    const st=stampStats(), newly=[];
    const grant=k=>{ if(!p.badges[k]){ p.badges[k]=todayK; newly.push(k); } };
    if(st.total>=1)grant('firstStamp');
    if(st.streak>=7)grant('streak7');
    if(st.streak>=30)grant('streak30');
    if(state.maxCombo>=5)grant('combo5');
    if(CONCEPT_IDS.filter(id=>p.concepts[id].mastery>=80).length>=5)grant('allMaster');
    return newly;
  }
};

/* kids game feel — 밝은 아르페지오 + 긴 진동 */
function blip(freqs,step,vol){
  const ac=ensureAudio(); if(!ac)return;
  const t0=ac.currentTime+0.01;
  freqs.forEach((f,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.value=f;
    const t=t0+i*(step||0.07);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(step||0.07)+0.05);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+(step||0.07)+0.08);
  });
}
function haptic(pat){ if(navigator.vibrate){ try{navigator.vibrate(pat);}catch(_){} } }
const Feel={
  ok(){ blip([880,1174,1568],0.07,0.16); haptic(20); },
  miss(){ blip([440,330],0.14,0.12); },
  combo(n){ blip([1046,1318,1568,1975].slice(0,Math.max(2,Math.min(4,n))),0.06,0.16); haptic(30); },
  levelup(){ blip([784,1046,1318,1568,2093],0.1,0.2); haptic([30,50,40,60]); }
};
function gradeFromRatio(r){ return r>=0.999?3 : r>=0.5?2 : r>0?1 : 0; }

/* ---------- 진도 저장 / 이어하기 ---------- */
const IN_SESSION=["stage1","stage2","stage3","stage4","stage5"];
function snapshotProgress(){
  if(state.mode!=="full"){ return; }
  // 세션 스테이지에서만 진도를 기록한다. 홈·도장판·intro 등 세션 밖 화면에선
  // 기존 진도를 건드리지 않아 '이어서 하기'가 유지된다(완료/새 판 시작에서만 해제).
  if(!IN_SESSION.includes(state.screen)){ return; }
  Store.patch(p=>{
    const started=(p.progress&&p.progress.startedAt)||new Date().toISOString();
    p.progress = {
      active:true, startedAt:started, screen:state.screen,
      scoreParts:state.scoreParts, seen:Array.from(state.seen),
      quiz2:state.quiz2, quiz4:state.quiz4, q2ans:state.q2ans, q4ans:state.q4ans,
      retrieveText:state.retrieveText, retrieveChecks:state.retrieveChecks, retrieveRevealed:state.retrieveRevealed,
      order:state.order, orderChecked:state.orderChecked, _shuffled:!!state._shuffled,
      combo:state.combo, maxCombo:state.maxCombo, sessionXp:state.sessionXp, wrongConcepts:state.wrongConcepts
    };
  });
}
function restoreProgress(p){
  const g=p.progress; if(!g||!g.active)return false;
  Object.assign(state,{
    scoreParts:g.scoreParts||{}, seen:new Set(g.seen||[]),
    quiz2:g.quiz2||state.quiz2, quiz4:g.quiz4||state.quiz4,
    q2ans:g.q2ans||[], q4ans:g.q4ans||[],
    retrieveText:g.retrieveText||"", retrieveChecks:g.retrieveChecks||Array(RETRIEVE_KEYS.length).fill(false),
    retrieveRevealed:!!g.retrieveRevealed,
    order:g.order||[0,1,2,3,4], orderChecked:!!g.orderChecked, _shuffled:!!g._shuffled,
    combo:g.combo||0, maxCombo:g.maxCombo||0, sessionXp:g.sessionXp||0,
    wrongConcepts:g.wrongConcepts||[], mode:"full", resumed:true
  });
  state._resumeScreen=g.screen;
  return true;
}
function clearSession(){
  Object.assign(state,{
    scoreParts:{}, seen:new Set(),
    retrieveChecks:Array(RETRIEVE_KEYS.length).fill(false), retrieveText:"", retrieveRevealed:false,
    order:[0,1,2,3,4], orderChecked:false, _shuffled:false,
    combo:0, maxCombo:0, sessionXp:0, wrongConcepts:[]
  });
}
function bootApp(){
  Store.patch(x=>{
    if(!x._migratedStamps)x._migratedStamps=true;
    const tk=todayKey();
    if(x.daily.date!==tk)x.daily={date:tk,seed:seedFromDate(tk),done:false};
  });
  restoreProgress(Store.load());
  state.screen='home';
  render();
}
function startFull(){ try{if(window.bx)bx('game_start');}catch(e){}
  clearSession(); newQuizRound();
  state.mode="full"; state.resumed=false; state._resumeScreen=null;
  Store.patch(p=>p.progress={active:true,startedAt:new Date().toISOString(),screen:'stage1'});
  go('stage1');
}
function resumeSession(){ try{if(window.bx)bx('resume_used');}catch(e){} if(state._resumeScreen)go(state._resumeScreen); }
function goHome(){ state.mode="full"; go('home'); }

  state.retrieveText=""; state.retrieveRevealed=false;
  state.reviewChecks={}; state.reviewQueue.forEach(id=>state.reviewChecks[id]=false);
  go('review');
}
function rReview(){
  const revealed=state.retrieveRevealed;
  const items=state.reviewQueue.map(id=>RETRIEVE_KEYS.find(k=>k.id===id)).filter(Boolean);
  stageEl.innerHTML=`
    <div class="eyebrow"><span>오늘의 복습 🔁</span></div>

    <div id="rvRevealWrap">
      ${revealed?`<div class="reveal-note done">✓ <b>책을 덮었어요!</b> 진짜 떠올린 작전을 콕 눌러 체크해요.</div>`
        :`<div class="reveal-note">✏️ <b>먼저 기억으로 써봐요.</b> 펼치기 전엔 정답이 안 보여요.</div>
          <button class="btn btn-green" id="rvRevealBtn" onclick="revealReview()" style="margin-top:14px;width:100%">다 썼어요 — 채점 열기 ▾</button>`}
    </div>
    <div id="rvCheckArea"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="goHome()">← 홈</button>
      <button class="btn btn-primary grow" id="rvNext" ${revealed?'':'disabled'} onclick="finishReview()">복습 끝! →</button>
    </div>`;
  const pad=document.getElementById('rpad');
  if(!revealed){ pad.addEventListener('input',()=>{state.retrieveText=pad.value;}); }
  else { paintReviewChecklist(); }
}
function revealReview(){
  const pad=document.getElementById('rpad'); state.retrieveText=pad.value; state.retrieveRevealed=true;
  // 자동 인식은 '채점 열기' 시 한 번만 — 이후엔 아이가 자유롭게 체크/해제
  const t=state.retrieveText.replace(/\s/g,"");
  state.reviewQueue.forEach(id=>{ const k=RETRIEVE_KEYS.find(x=>x.id===id); if(k&&k.words.some(w=>t.includes(w)))state.reviewChecks[id]=true; });
  render();
}
function paintReviewChecklist(){
  const area=document.getElementById('rvCheckArea'); if(!area)return;
  area.innerHTML=`<p class="hint" style="margin-top:16px">진짜 떠올린 작전을 콕 체크해요! (자동 인식 + 직접 체크)</p>
    <div class="checklist">${state.reviewQueue.map(id=>{const k=RETRIEVE_KEYS.find(x=>x.id===id);return `
      <div class="ck ${state.reviewChecks[id]?'hit':''}" data-id="${id}" onclick="toggleReviewCk('${id}')">
        <div class="box">✓</div><div class="cktx"><b>${k.emoji} ${k.label}</b><span>${k.hint}</span></div>
      </div>`;}).join('')}</div>`;
  const b=document.getElementById('rvNext'); if(b)b.disabled=false;
}
// 전체 render() 대신 클래스만 토글 → 스크롤 점프 없음 + 자동인식이 다시 덮어쓰지 않음
function toggleReviewCk(id){
  state.reviewChecks[id]=!state.reviewChecks[id];
  const el=document.querySelector(`.ck[data-id="${id}"]`);
  if(el)el.classList.toggle('hit',state.reviewChecks[id]);
}
function finishReview(){ try{if(window.bx)bx('review_done');}catch(e){}
  const tk=todayKey(); let hit=0;
  Store.patch(p=>{
    state.reviewQueue.forEach(id=>{ const got=state.reviewChecks[id]?1:0; hit+=got; SRS.schedule(p.concepts[id],got?2:0,tk); });
    const gain=state.reviewQueue.length*5 + hit*8; state.sessionXp=gain;
    if(Meta.addXp(p,gain))Feel.levelup();
    Meta.checkBadges(p,tk);
    if(SRS.due(p,tk).length===0)p.daily.done=true;
  });
  showToast(`복습 완료! ${hit}/${state.reviewQueue.length}개 꺼냈어요 🎉`);
  state.mode="full"; go('home');
}

/* ---------- quiz ---------- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuizSet(pool){
  return shuffle(pool).map(group=>{
    const v=group.variants[Math.floor(Math.random()*group.variants.length)];
    return {stem:v.stem, options:shuffle(v.options), ex:v.ex};
  });
}
function newQuizRound(){
  state.quiz2=buildQuizSet(QUIZ2_POOL);
  state.quiz4=buildQuizSet(QUIZ4_POOL);
  state.q2ans=Array(state.quiz2.length).fill(null);
  state.q4ans=Array(state.quiz4.length).fill(null);
}
function renderQuiz(opts){
  const {data,answersArr,eyebrowNum,eyebrowTxt,title,lead,nextKey,nextLabel,backScreen,stageKey}=opts;
  stageEl.innerHTML=`
    <div class="eyebrow"><span class="num">${eyebrowNum}</span> ${eyebrowTxt}</div>
    <h2>${title}</h2>
    <p class="lead">${lead}</p>
    <div id="qbox"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="go('${backScreen}')">← 뒤로</button>
      <button class="btn btn-primary grow" id="qnext" disabled onclick="${nextKey}">${nextLabel}</button>
    </div>`;
  const box=document.getElementById('qbox');
  box.innerHTML=data.map((q,qi)=>`
    <div class="q" data-qi="${qi}">
      <div class="q-stem"><span class="qn">Q${qi+1}.</span><span>${q.stem}</span></div>
      <div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-oi="${oi}" onclick="answer('${stageKey}',${qi},${oi})"><span class="mk">${String.fromCharCode(65+oi)}</span><span>${o.t}</span></button>`).join("")}</div>
      <div class="exslot"></div>
    </div>`).join("");
  answersArr.forEach((a,qi)=>{ if(a!==null) paintAnswer(stageKey,qi,a); });
  refreshQuizNext(stageKey);
}
function answer(stageKey,qi,oi){
  const arr=stageKey==="q2"?state.q2ans:state.q4ans;
  if(arr[qi]!==null) return;
  arr[qi]=oi;
  const data=stageKey==="q2"?state.quiz2:state.quiz4;
  const correct=data[qi].options[oi].ok;
  if(correct){ state.combo++; state.maxCombo=Math.max(state.maxCombo,state.combo); if(state.combo>=2)Feel.combo(state.combo); else Feel.ok(); }
  else{ state.combo=0; Feel.miss(); }
  paintAnswer(stageKey,qi,oi);
  flashCombo(correct);
  refreshQuizNext(stageKey);
}
/* kids 콤보 — 큰 팝 연출 */
function flashCombo(correct){
  let el=document.getElementById('combobar');
  if(!el){ el=document.createElement('div'); el.id='combobar'; el.className='combobar'; stageEl.insertBefore(el,stageEl.firstChild.nextSibling); }
  if(correct && state.combo>=2){ el.textContent=`콤보 ${state.combo}!! 🔥`; el.className='combobar show pop'; }
  else if(!correct){ el.textContent='아깝다! 다시 해봐요 🌱'; el.className='combobar reset show'; }
  else { el.className='combobar'; }
  clearTimeout(el._t); el._t=setTimeout(()=>{el.className='combobar';},1500);
}
function paintAnswer(stageKey,qi,oi){
  const data=stageKey==="q2"?state.quiz2:state.quiz4;
  const q=data[qi];
  const qEl=document.querySelector(`.q[data-qi="${qi}"]`);
  if(!qEl)return;
  qEl.querySelectorAll('.opt').forEach(b=>{
    const bi=+b.dataset.oi;
    b.disabled=true;
    if(q.options[bi].ok)b.classList.add('correct');
    if(bi===oi && !q.options[bi].ok)b.classList.add('wrong');
  });
  const good=q.options[oi].ok;
  qEl.querySelector('.exslot').innerHTML=`<div class="explain ${good?'':'bad'}"><span class="ee">${good?'🎉':'💡'}</span>${q.ex}</div>`;
}
function refreshQuizNext(stageKey){
  const arr=stageKey==="q2"?state.q2ans:state.q4ans;
  const done=arr.length>0 && arr.every(a=>a!==null);
  const btn=document.getElementById('qnext');
  if(btn)btn.disabled=!done;
}

let DRAG=null;
const REDUCE=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function startDrag(e){
  if(state.orderChecked)return;
  const item=e.target.closest('.seqitem');
  if(!item)return;
  if(e.button!==undefined && e.button!==0)return;
  e.preventDefault();
  const seq=document.getElementById('seq');
  const items=[...seq.children];
  const rects=items.map(el=>el.getBoundingClientRect());
  const startIndex=items.indexOf(item);
  const step=rects.length>1 ? Math.abs(rects[1].top-rects[0].top) : rects[startIndex].height+11;
  DRAG={item,seq,items,startIndex,curIndex:startIndex,n:items.length,step,startY:e.clientY,pid:e.pointerId};
  item.classList.add('dragging');
  item.style.transition='none';
  item.style.zIndex='30';
  try{item.setPointerCapture(e.pointerId);}catch(_){}
  item.addEventListener('pointermove',onDrag);
  item.addEventListener('pointerup',endDrag);
  item.addEventListener('pointercancel',endDrag);
}
function onDrag(e){
  if(!DRAG)return;
  e.preventDefault();
  const dy=e.clientY-DRAG.startY;
  DRAG.item.style.transform=`translateY(${dy}px)`;
  const moved=Math.round(dy/DRAG.step);
  const target=Math.max(0,Math.min(DRAG.n-1,DRAG.startIndex+moved));
  if(target!==DRAG.curIndex){
    DRAG.curIndex=target;
    applyDragShift();
  }
}
function applyDragShift(){
  const {items,startIndex,curIndex,step}=DRAG;
  items.forEach((el,oi)=>{
    let finalPos;
    if(oi===startIndex){
      finalPos=curIndex;
    }else{
      finalPos=oi;
      if(oi>startIndex)finalPos--;
      if(finalPos>=curIndex)finalPos++;
      const shift=(finalPos-oi)*step;
      el.style.transition=REDUCE?'none':'transform .16s cubic-bezier(.2,.8,.2,1)';
      el.style.transform= shift?`translateY(${shift}px)`:'';
    }
    const rk=el.querySelector('.rank');
    if(rk)rk.textContent=finalPos+1;
  });
}
function endDrag(){
  if(!DRAG)return;
  const {item,items,startIndex,curIndex,pid}=DRAG;
  const order=items.map(el=>+el.dataset.step);
  const [moved]=order.splice(startIndex,1);
  order.splice(curIndex,0,moved);
  items.forEach(el=>{el.style.transition='';el.style.transform='';el.style.zIndex='';el.classList.remove('dragging');});
  try{item.releasePointerCapture(pid);}catch(_){}
  item.removeEventListener('pointermove',onDrag);
  item.removeEventListener('pointerup',endDrag);
  item.removeEventListener('pointercancel',endDrag);
  DRAG=null;
  state.order=order;
  renderSeq();
}

}

let AUDIO=null, OLD_TITLE=null;
function ensureAudio(){
  try{
    if(!AUDIO)AUDIO=new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO&&AUDIO.state==='suspended')AUDIO.resume();
  }catch(_){AUDIO=null;}
  return AUDIO;
}
function playChime(){
  const ac=ensureAudio(); if(!ac)return;
  const seq=[523.25,659.25,783.99,1046.5];
  const base=ac.currentTime+0.02;
  for(let r=0;r<2;r++){
    seq.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=base + r*1.05 + i*0.16;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t+0.75);
    });
  }
}
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),500);};
  t.addEventListener('click',kill);
  setTimeout(kill,6000);
}
function fireTimerAlert(){
  playChime();
  showToast('15분 집중 끝! 잠깐 쉬었다 또 해요 🎉');
  const tm=document.querySelector('.timer'); if(tm)tm.classList.add('ringing');
  if(navigator.vibrate){try{navigator.vibrate([200,120,200,120,320]);}catch(_){}}
  try{ if(OLD_TITLE===null)OLD_TITLE=document.title; document.title='⏰ 집중 끝! · 백지의 방 키즈'; }catch(_){}
}
function clearTimerAlert(){
  const tm=document.querySelector('.timer'); if(tm)tm.classList.remove('ringing');
  try{ if(OLD_TITLE!==null){document.title=OLD_TITLE; OLD_TITLE=null;} }catch(_){}
}
function syncClock(){
  const c=document.getElementById('clock');
  if(!c)return;
  const mm=String(Math.floor(state.timer.sec/60)).padStart(2,'0');
  const ss=String(state.timer.sec%60).padStart(2,'0');
  c.textContent=`${mm}:${ss}`;
  const b=document.getElementById('tbtn');
  if(b)b.textContent=state.timer.running?"멈춤":(state.timer.sec===15*60?"시작":"다시");
}
function toggleTimer(){
  if(state.timer.running){
    clearInterval(state.timer.id);state.timer.running=false;
  }else{
    ensureAudio();
    state.timer.running=true;
    state.timer.id=setInterval(()=>{
      if(state.timer.sec>0){state.timer.sec--;syncClock();}
      if(state.timer.sec===0){
        clearInterval(state.timer.id);state.timer.running=false;
        const c=document.getElementById('clock');if(c)c.textContent="끝! 🎉";
        const cap=document.querySelector('.timer .tcap b');if(cap)cap.textContent="잠깐 쉬는 시간!";
        const b=document.getElementById('tbtn');if(b){b.textContent="또 15분";b.onclick=()=>{clearTimerAlert();state.timer.sec=15*60;b.onclick=toggleTimer;syncClock();toggleTimer();};}
        fireTimerAlert();
      }
    },1000);
  }
  syncClock();
}

function restart(){
  if(state.timer.id)clearInterval(state.timer.id);
  clearTimerAlert();
  clearSession();
  Object.assign(state,{
    reps:{d1:false,d3:false,d7:false},
    timer:{sec:15*60,running:false,id:null},
    mode:"full", resumed:false, _resumeScreen:null
  });
  Store.patch(p=>p.progress={active:false});
  newQuizRound();
  go('home');
}

/* ============================ BOOT ============================ */
newQuizRound();
bootApp();
</script>
<!-- bx — 프라이버시 안전 이용패턴 계측: 쿠키리스·집계·이벤트명 enum만(PII/아동입력 미수집). GoatCounter 이벤트로 전송. -->
<script>
(function(){
  window.bxq=window.bxq||[];
  function send(nm){ if(window.goatcounter&&window.goatcounter.count){window.goatcounter.count({path:'evt/'+nm,title:nm,event:true});}else{window.bxq.push(nm);} }
  window.bx=function(name){
    try{name=String(name).slice(0,40).replace(/[^a-zA-Z0-9_./-]/g,'');}catch(e){return;}
    if(!name)return;
    try{var k='baekji.bx.events',a=JSON.parse(localStorage.getItem(k)||'[]');a.push({n:name,t:Date.now()});if(a.length>120)a=a.slice(-120);localStorage.setItem(k,JSON.stringify(a));}catch(e){}
    send(name);
  };
  // A/B 변이: 기기로컬 시드 기반 결정적 배정(식별자 전송 없음)
  window.bxVariant=function(exp,n){
    n=n||2; var s;
    try{s=localStorage.getItem('baekji.bx.seed');if(!s){s=String(Math.floor(Math.random()*1e9));localStorage.setItem('baekji.bx.seed',s);}}catch(e){s='0';}
    var str=exp+':'+s,h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;} return h%n;
  };
  // GoatCounter 로드 후 대기열 flush
  window.addEventListener('load',function(){var t=0,iv=setInterval(function(){if(window.goatcounter&&window.goatcounter.count){window.bxq.splice(0).forEach(function(nm){window.goatcounter.count({path:'evt/'+nm,title:nm,event:true});});clearInterval(iv);}else if(++t>25)clearInterval(iv);},300);});
  // 세션 1회: 디바이스 클래스·뷰포트 버킷 분포(개선 판단용)
  try{ if(!sessionStorage.getItem('baekji.bx.sess')){ sessionStorage.setItem('baekji.bx.sess','1');
    var w=Math.round(innerWidth), dev=w<768?'mobile':w<1024?'tablet':'desktop';
    var bk=[320,360,390,414,768,834,1024,1280,1440], b=bk.reduce(function(a,c){return Math.abs(c-w)<Math.abs(a-w)?c:a;});
    window.bx('device/'+dev); window.bx('vw/'+b);
  }}catch(e){}
  window.addEventListener('error',function(){try{window.bx('error/js');}catch(e){}});
})();
</script>
